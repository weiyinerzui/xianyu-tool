# 闲鱼违禁词库 v1
# 来源：goofish-cli skills/goofish-risk-guard 知识库转换
# 分类说明：
#   severity: block  = 必须删除/替换，否则拒绝发布
#   severity: warn   = 建议修改，可能触发降权
#   severity: info   = 提示性，需结合上下文判断
#
# 每个词条字段：
#   word:        违禁词原文
#   replacement: 推荐替换词（可选）
#   note:        说明（可选）

# ============================================================
# 一类：绝对化用语（广告法红线，severity=block）
# ============================================================
absolute:
  severity: block
  words:
    # 极限词
    - { word: "最", replacement: "较", note: "广告法极限词" }
    - { word: "最佳", replacement: "优质", note: "广告法极限词" }
    - { word: "最好", replacement: "优质", note: "广告法极限词" }
