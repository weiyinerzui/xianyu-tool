    # 绝对承诺
    - { word: "绝对", replacement: "", note: "绝对承诺" }
    - { word: "永久", replacement: "长期", note: "绝对承诺" }
    - { word: "永远", replacement: "长期", note: "绝对承诺" }
    - { word: "百分百", replacement: "", note: "绝对承诺" }
