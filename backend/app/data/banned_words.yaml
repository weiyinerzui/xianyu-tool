# ============================================================
# 正则规则（用于变体检测，如手机号、QQ号、微信号变形）
# ============================================================
regex_rules:
  - name: "手机号"
    pattern: '1[3-9]\d{9}'
    severity: warn
    note: "11位手机号，需结合上下文判断是否为外联"
    replacement: "闲鱼私信联系"
  - name: "QQ号长串"
    pattern: '[1-9]\d{6,11}'
    severity: info
    note: "可能是QQ号，需结合上下文含'Q'/'扣'等字判断"
    replacement: "闲鱼私信联系"
